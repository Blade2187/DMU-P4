<html>

  <head>
    <meta name="viewport" content="width=580px, initial-scale=1.0, viewport-fit=contain">
    <link rel="stylesheet" type="text/css" href="dmu-p4.css">
    <script type="text/javascript" src="dmu-p4.js"></script>
  </head>

  <body>
    <div id="content">

      <fieldset>
        <legend>Water/Lightning</legend>
        <label><input type="radio" name="stackspread" checked>Stack</label>
        <label><input type="radio" name="stackspread">Spread</label>
      </fieldset>

      <fieldset>
        <legend>Accel Bomb</legend>
        <label><input type="radio" name="accel" checked>Stillness</label>
        <label><input type="radio" name="accel">Motion</label>
      </fieldset>

      <hr>

      <fieldset>
        <legend>Grand Cross 1</legend>
        <label><input type="radio" name="gc1" checked>Look Away</label>
        <label><input type="radio" name="gc1">Look In</label>
      </fieldset>

      <fieldset>
        <legend>Inferno</legend>
        <label><input type="radio" name="inferno" checked>Move</label>
        <label><input type="radio" name="inferno">Wait</label>
      </fieldset>

      <fieldset>
        <legend>Grand Cross 2</legend>
        <label><input type="radio" name="gc2" checked>Look Away</label>
        <label><input type="radio" name="gc2">Look In</label>
      </fieldset>

      <fieldset>
        <legend>Tsunami</legend>
        <label><input type="radio" name="tsunami" checked>Wait</label>
        <label><input type="radio" name="tsunami">Move</label>
      </fieldset>

      <hr>

      <fieldset>
        <legend>Thunder</legend>
        <label><input type="radio" name="thunder" checked>Real</label>
        <label><input type="radio" name="thunder">Fake</label>
        <button type="toggle" class="realfake" name="thunder">Real</button>
      </fieldset>

      <fieldset>
        <legend>Blizzard</legend>
        <label><input type="radio" name="blizzard" checked>Real</label>
        <label><input type="radio" name="blizzard">Fake</label>
        <button type="toggle" class="realfake" name="blizzard">Real</button>
      </fieldset>

      <hr>

      <p>
        <button type="button" onclick="resetAll()">Reset</button>
        <button type="button" id="popOutBtn" onclick="popOut()">Pop Out</button>
        <button type="toggle" id="layoutBtn" onclick="toggleLayout()">Layout</button>
      </p>

      <p>DMU P4 Helper v0.2</p>
      <p>Made by: Wyssberk Kajitani @ Behemoth</p>
      <p>Inspired by: <a href="https://wtfdig.info">wtfdig</a> by Mara Kaminagi @ Adamantoise</p>
      <p>License: <a href="https://opensource.org/license/MIT">MIT</a>, Source: <a href="https://github.com/Blade2187/DMU-P4">GitHub</a></p>

    </div>
  </body>

</html>
